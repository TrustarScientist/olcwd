<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSHARER | Knowledge Sharing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap"
        rel="stylesheet">



    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .brand-font {
            font-family: 'Manrope', sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }

        .content-area {
            max-width: 1200px;
            margin: 0 auto;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* For modern browsers (Chrome, Safari, Edge, modern Firefox) */
        ::selection {
            background-color: #2ecc71;
            /* A nice green color */
            color: #ffffff;
            /* Text color when highlighted */
        }

        /* For older Firefox versions */
        ::-moz-selection {
            background-color: #2ecc71;
            color: #ffffff;
        }

        /* Hide Scrollbar but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <!-- nav -->
    <div class="min-h-screen bg-[#F8FAFC] font-[Inter] flex flex-col">
    
        <header
            class="h-16 bg-white border-b border-slate-200 sticky top-0 z-50 px-4 md:px-8 flex items-center justify-between">
            <div class="flex-1 max-w-2xl relative">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" placeholder="Search the island for knowledge..."
                    class="w-full bg-slate-100 border-none rounded-xl py-2.5 pl-11 pr-4 text-sm focus:ring-2 focus:ring-[#198754]/20 transition-all">
            </div>
    
            <div class="flex items-center gap-4 ml-6">
                <button class="relative p-2 text-slate-500 hover:bg-slate-50 rounded-lg transition-colors">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                </button>
                <div
                    class="w-9 h-9 bg-[#198754] rounded-xl flex items-center justify-center text-white font-bold text-xs shadow-lg shadow-green-100 cursor-pointer">
                    JD
                </div>
            </div>
        </header>
    
        <div class="flex flex-1 max-w-[1600px] mx-auto w-full">
    
            <aside class="hidden lg:flex w-[22%] flex-col border-r border-slate-200 h-[calc(100vh-64px)] sticky top-16 p-6">
    
                <nav class="flex-1 space-y-1">
                    <a href="#"
                        class="flex items-center gap-3 px-4 py-3 bg-[#198754]/10 text-[#198754] rounded-xl font-bold text-sm transition-all">
                        <i data-lucide="home" class="w-5 h-5"></i> Home
                    </a>
    
                    <a href="#"
                        class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-semibold text-sm transition-all">
                        <i data-lucide="compass" class="w-5 h-5"></i> Explore
                    </a>
    
                    <a href="#"
                        class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-semibold text-sm transition-all">
                        <i data-lucide="layers" class="w-5 h-5"></i> My Niches
                    </a>
    
                    <a href="#"
                        class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-semibold text-sm transition-all">
                        <i data-lucide="book-open" class="w-5 h-5"></i> Resources
                    </a>
    
                    <a href="#"
                        class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-semibold text-sm transition-all">
                        <i data-lucide="user-check" class="w-5 h-5"></i> Mentors
                    </a>
    
                    <a href="#"
                        class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-semibold text-sm transition-all">
                        <i data-lucide="mail" class="w-5 h-5"></i> Messages
                    </a>
    
                    <div class="py-4">
                        <div class="h-px bg-slate-100"></div>
                    </div>
    
                    <a href="#"
                        class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-semibold text-sm transition-all">
                        <i data-lucide="layout" class="w-5 h-5"></i> My Space
                    </a>
                </nav>
    
                <div class="mt-auto bg-slate-900 rounded-[2rem] p-5 text-white relative overflow-hidden group">
                    <div class="relative z-10">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Zini
                                Balance</span>
                            <i data-lucide="wallet" class="w-4 h-4 text-[#198754]"></i>
                        </div>
                        <div class="flex items-baseline gap-1 mb-4">
                            <span class="text-2xl font-black font-[Manrope]">1,420</span>
                            <span class="text-xs font-bold text-[#198754]">Zini</span>
                        </div>
                        <button
                            class="w-full py-2.5 bg-[#198754] text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-[#157347] transition-all">
                            Top Up
                        </button>
                    </div>
                    <div
                        class="absolute -right-4 -bottom-4 w-20 h-20 bg-[#198754]/20 rounded-full blur-2xl group-hover:bg-[#198754]/30 transition-all">
                    </div>
                </div>
            </aside>
    
            <main class="w-full lg:w-[56%] min-h-screen p-4 md:p-8">
                <div class="max-w-xl mx-auto space-y-6">
                    <p class="text-slate-400 text-center py-20 text-sm font-medium">Knowledge stream loading...</p>
                </div>
            </main>
    
            <aside class="hidden xl:flex w-[22%] flex-col h-[calc(100vh-64px)] sticky top-16 p-6">
            </aside>
    
        </div>
    
        <nav
            class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-3 flex justify-between items-center z-50">
            <button class="text-[#198754]"><i data-lucide="home" class="w-6 h-6"></i></button>
            <button class="text-slate-400"><i data-lucide="compass" class="w-6 h-6"></i></button>
            <button
                class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center text-white -mt-8 border-4 border-[#F8FAFC] shadow-lg">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </button>
            <button class="text-slate-400"><i data-lucide="mail" class="w-6 h-6"></i></button>
            <button class="text-slate-400"><i data-lucide="user" class="w-6 h-6"></i></button>
        </nav>
    
    </div>
    
    <script>lucide.createIcons();</script>





    <!-- scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script>
        lucide.createIcons();
        document.addEventListener('alpine:init', () => {
            Alpine.effect(() => {
                // Slight delay to allow DOM update before icon rendering
                setTimeout(() => lucide.createIcons(), 50);
            });
        });
    </script>
</body>

</html>
